<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DevOps continuous feedback loop</title>
  <desc id="desc">A visual DevOps cycle from changing code through testing, deployment, monitoring, feedback and continuous improvement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#dc2626"/>
    </marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; letter-spacing: 2px; fill: #475569; }
      .node-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #475569; }
      .legend { font: 400 16px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <text x="90" y="82" class="title">DevOps continuous feedback loop</text>
  <text x="90" y="120" class="subtitle">Deliver a change, observe the result, learn from feedback, and improve the next change.</text>

  <rect x="90" y="170" width="1420" height="560" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>

  <rect x="125" y="205" width="620" height="470" rx="20" fill="#eff6ff"/>
  <rect x="775" y="205" width="390" height="470" rx="20" fill="#ecfdf5"/>
  <rect x="1195" y="205" width="280" height="470" rx="20" fill="#f5f3ff"/>

  <text x="160" y="250" class="section">DELIVERY</text>
  <text x="810" y="250" class="section">OPERATIONS</text>
  <text x="1230" y="250" class="section">LEARNING</text>

  <g filter="url(#shadow)">
    <rect x="160" y="300" width="230" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="275" y="342" text-anchor="middle" class="node-title">Change code</text>
    <text x="275" y="372" text-anchor="middle" class="node-text">Feature, fix or</text>
    <text x="275" y="394" text-anchor="middle" class="node-text">configuration change</text>

    <rect x="470" y="300" width="230" height="105" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="585" y="342" text-anchor="middle" class="node-title">Build and review</text>
    <text x="585" y="372" text-anchor="middle" class="node-text">Prepare and check</text>
    <text x="585" y="394" text-anchor="middle" class="node-text">the change</text>

    <rect x="310" y="510" width="230" height="105" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="425" y="552" text-anchor="middle" class="node-title">Automated tests</text>
    <text x="425" y="582" text-anchor="middle" class="node-text">Does the change</text>
    <text x="425" y="604" text-anchor="middle" class="node-text">behave correctly?</text>

    <rect x="810" y="300" width="230" height="105" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="925" y="342" text-anchor="middle" class="node-title">Deploy safely</text>
    <text x="925" y="372" text-anchor="middle" class="node-text">Release the approved</text>
    <text x="925" y="394" text-anchor="middle" class="node-text">version</text>

    <rect x="810" y="510" width="230" height="105" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="925" y="552" text-anchor="middle" class="node-title">Monitor</text>
    <text x="925" y="582" text-anchor="middle" class="node-text">Health, logs, alerts</text>
    <text x="925" y="604" text-anchor="middle" class="node-text">and performance</text>

    <rect x="1220" y="300" width="230" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1335" y="342" text-anchor="middle" class="node-title">Collect feedback</text>
    <text x="1335" y="372" text-anchor="middle" class="node-text">Users, metrics and</text>
    <text x="1335" y="394" text-anchor="middle" class="node-text">deployment results</text>

    <rect x="1220" y="510" width="230" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1335" y="552" text-anchor="middle" class="node-title">Improve</text>
    <text x="1335" y="582" text-anchor="middle" class="node-text">Choose the next</text>
    <text x="1335" y="604" text-anchor="middle" class="node-text">useful change</text>
  </g>

  <path d="M390 352 H470" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M585 405 C585 470 520 510 540 550" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M540 562 H810" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M925 405 V510" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1040 562 H1220" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1335 405 V510" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#purpleArrow)"/>
  <path d="M1220 562 C1120 750 540 760 275 405" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#purpleArrow)"/>
  <path d="M310 562 C220 562 210 455 275 405" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#redArrow)"/>

  <text x="610" y="476" class="label">pass</text>
  <text x="230" y="500" class="label" fill="#dc2626">fix and retry</text>
  <text x="1000" y="742" class="label" fill="#7c3aed">continuous improvement</text>

  <rect x="90" y="780" width="1420" height="70" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="125" y1="814" x2="180" y2="814" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="200" y="820" class="legend">Normal delivery path</text>
  <line x1="470" y1="814" x2="525" y2="814" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#redArrow)"/>
  <text x="545" y="820" class="legend">Failure recovery</text>
  <line x1="790" y1="814" x2="845" y2="814" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#purpleArrow)"/>
  <text x="865" y="820" class="legend">Learning loop</text>
</svg>
